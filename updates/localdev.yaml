- name: "Find symlinked mods"
  find:
    paths: "{{ application_folder_destination }}/mod"
    file_type: "link"
  register: "modlinks"
- name: "Delete symlinked mods"
  file:
    path: "{{ modlink.path }}"
    state: "absent"
  loop: "{{ modlinks.files }}"
  loop_control:
    loop_var: "modlink"
- name: "Reinitialize mod directory"
  composer:
    command: "run-script"
    arguments: "post-install-cmd"
    working_dir: "{{ application_folder_destination }}"
    composer_executable: "/usr/bin/composer.phar"
    executable: "{{ php_command }}"