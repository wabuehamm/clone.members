- name: "Install mechanize dependency"
  pip:
    virtualenv: ".venv"
    name: "mechanize"
    virtualenv_command: "python -m venv"
- name: "Export iCal"
  script: "exportics.py"
  environment:
    ELGG_URL: "{{url_destination}}"
    ELGG_USER: "{{application_admin_username}}"
    ELGG_PASSWORD: "{{application_admin_password}}"
- name: "Remove old modules via composer"
  composer:
    command: "remove"
    arguments: "coldtrick/content_subscriptions juho-jaakkola/elgg-notification_tools iionly/autosubscribegroup iionly/elgg_update_services coldtrick/analytics"
- name: "Remove event_calendar"
  file:
    path: "{{ application_folder_destination }}/mod/event_calendar"
    state: "absent"
- name: "Remove advanced_comments"
  file:
    path: "{{ application_folder_destination }}/mod/advanced_comments"
    state: "absent"
- name: "Require updates"
  composer:
    command: "require"
    arguments: "{{ packages | join(' ') }}"
  vars:
    packages:
      - "coldtrick/csv_exporter^14.0"
      - "coldtrick/entity_attachments^7.0"
      - "coldtrick/event_manager=dev-main#a955d3bf50a2d730c8d153e95f2ccb86b03718c3"
      - "coldtrick/group_tools^22.1"
      - "coldtrick/login_redirector=dev-master#7cf5edeafc4443c23c4a6c97b560967c48b1eb8a"
      - "coldtrick/menu_builder^11.0"
      - "coldtrick/poll^12.1"
      - "coldtrick/profile_manager^22.0"
      - "coldtrick/redirector^6.0"
      - "coldtrick/site_announcements^12.0"
      - "elgg/elgg~6.3"
      - "iionly/elgg_update_services^3.3"
      - "iionly/favicon_override^4.0"
      - "wabuehamm/filetransport#dev-elgg6"
      - "wabuehamm/membership#dev-elgg6"
      - "wabuehamm/wabue#dev-elgg6"
      - "wabuehamm/big_avatar#dev-elgg6"
      - "wabuehamm/backtotop#dev-elgg6"
      - "wabuehamm/autounsubscribe#dev-elgg6"
- name: "Run system upgrade"
  command: "{{ php_command }} vendor/bin/elgg-cli upgrade"
- name: "Run database:optimize"
  command: "{{ php_command }} vendor/bin/elgg-cli database:optimize"
- name: "Run cache:invalidate"
  command: "{{ php_command }} vendor/bin/elgg-cli cache:invalidate"
- name: "Configure plugins"
  command: "{{ php_command }} vendor/bin/elgg-cli wabue:pluginsettings {{ setting.plugin }} {{ setting.setting }} {{ setting.value }} chdir={{ application_folder_destination }}"
  loop: "{{ settings }}"
  loop_control:
    loop_var: "setting"
  vars:
    settings:
      - plugin: "event_manager"
        setting: "ical_direct"
        value: "1"
      - plugin: "event_manager"
        setting: "type_list"
        value: "Arbeitseinsatz,Workshop,Vereinsfeier,Vereinsfahrt,Private Feier,Besprechung,Vereinsgruppen,Wintertheater,Vormittag,Nachmittag,Abend"
      - plugin: "event_manager"
        setting: "maps_provider"
        value: "none"
      - plugin: "event_manager"
        setting: "add_event_to_calendar"
        value: "no"
- name: "Import iCal"
  command: "{{ php_command }} vendor/bin/elgg-cli wabue:importics Calendar.ics chdir={{ application_folder_destination }}"
